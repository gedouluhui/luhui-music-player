name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Python regression tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # PyAudioWPatch 是 guarded import，CI 没有声卡也不真播；imageio-ffmpeg 则必须装：
      # A4 解码失败测试要用它自带的 ffmpeg 二进制跑子进程，只解码到内存，不开设备。
      # PyQt5 用于 A3/A4 前端逻辑测试：用 QJSEngine 跑 web/app.js 里的纯函数，不建窗口。
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy scipy mutagen Pillow imageio-ffmpeg PyQt5
      - name: Run offline regression suites
        run: python -m pytest tests -q

  winui-build:
    name: WinUI shell build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build LuHuiMusic.exe (Release)
        run: dotnet build native/SaltPlayer.Native/SaltPlayer.Native.csproj -c Release -v minimal
